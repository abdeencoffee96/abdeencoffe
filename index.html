<title>بن عابدين | Abdeen Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Aref+Ruqaa:wght@700&family=Fraunces:ital,wght@0,300;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#c9a06a;
    --kraft-dark:#8a6a41;
    --espresso:#241209;
    --espresso-deep:#160b05;
    --gold:#c99a4a;
    --gold-bright:#e6bd75;
    --cream:#f3e7d4;
    --cream-dim:#d9c6a9;
    --glass: rgba(22, 11, 5, 0.55);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    min-height:100svh;
    font-family:'Tajawal', 'Jost', sans-serif;
    color:var(--cream);
    background:#000;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- BACKGROUND ---------- */
  .bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(180deg, rgba(15,8,4,0.55) 0%, rgba(16,9,4,0.35) 35%, rgba(10,6,3,0.65) 68%, rgba(8,4,2,0.94) 100%),
      url("bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: saturate(1.05) contrast(1.02);
    transform: scale(1.06);
    z-index:-2;
  }
  .grain{
    position:fixed; inset:0; z-index:-1; opacity:.05; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- LANG TOGGLE ---------- */
  .lang-toggle{
    position:fixed;
    top:22px;
    inset-inline-end:22px;
    z-index:50;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--glass);
    border:1px solid rgba(230,189,117,0.45);
    backdrop-filter:blur(8px);
    border-radius:999px;
    padding:6px;
  }
  .lang-toggle button{
    font-family:'Jost',sans-serif;
    font-size:12.5px;
    letter-spacing:.12em;
    background:transparent;
    border:none;
    color:var(--cream-dim);
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .35s ease;
  }
  .lang-toggle button.active{
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#241209;
    font-weight:700;
  }

  /* ---------- LAYOUT ---------- */
  .wrap{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 100px 22px 56px;
    position:relative;
    z-index:1;
  }

  /* signature ring badge, echoes the cup logo */
  .badge{
    width:112px;height:112px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    margin-bottom:26px;
    animation: rise .9s cubic-bezier(.2,.9,.25,1) both, spin 40s linear infinite;
    animation-delay: 0s, .9s;
  }
  .badge::before{
    content:"";
    position:absolute; inset:8px;
    border-radius:50%;
    border:1px dashed rgba(230,189,117,.55);
  }
  .badge .dots{
    position:absolute; inset:0;
  }
  .badge .dots span{
    position:absolute;
    width:3px;height:3px;
    background:var(--gold-bright);
    border-radius:50%;
    top:50%;left:50%;
  }
  .badge .core{
    font-family:'Aref Ruqaa','Fraunces',serif;
    font-size:30px;
    font-weight:700;
    color:var(--gold-bright);
    animation: counterspin 40s linear infinite;
    line-height:1;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes counterspin{ to{ transform:rotate(-360deg); } }
  @keyframes rise{
    from{opacity:0; transform:translateY(18px) scale(.9);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold-bright);
    opacity:.9;
    margin-bottom:14px;
    animation: rise .9s .12s cubic-bezier(.2,.9,.25,1) both;
  }

  h1{
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    line-height:1.05;
    font-weight:900;
    color:var(--cream);
    text-shadow: 0 6px 30px rgba(0,0,0,.55);
    animation: rise .9s .2s cubic-bezier(.2,.9,.25,1) both;
    margin-bottom:6px;
  }
  h1 .en{
    display:block;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(1rem,3.2vw,1.35rem);
    letter-spacing:.03em;
    color:var(--gold-bright);
    margin-top:10px;
  }

  .tagline{
    max-width:520px;
    margin: 18px auto 40px;
    font-size: clamp(.95rem, 2.4vw, 1.08rem);
    line-height:1.9;
    color:var(--cream-dim);
    font-weight:300;
    animation: rise .9s .3s cubic-bezier(.2,.9,.25,1) both;
  }

  .divider{
    width:64px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 40px;
    animation: rise .9s .38s cubic-bezier(.2,.9,.25,1) both;
  }

  /* ---------- LINKS ---------- */
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:380px;
    animation: rise .9s .46s cubic-bezier(.2,.9,.25,1) both;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 22px;
    border-radius:16px;
    text-decoration:none;
    color:var(--cream);
    background:linear-gradient(180deg, rgba(60,38,20,.55), rgba(30,17,9,.65));
    border:1px solid rgba(201,160,106,.35);
    backdrop-filter: blur(6px);
    position:relative;
    overflow:hidden;
    transition: transform .35s cubic-bezier(.2,.9,.25,1), border-color .35s ease, background .35s ease;
  }
  .link-btn:active{ transform:scale(.98); }
  .link-btn:hover{
    border-color: var(--gold-bright);
    background:linear-gradient(180deg, rgba(80,52,26,.7), rgba(38,22,11,.78));
    transform: translateY(-3px);
  }
  .link-btn::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(230,189,117,.16) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform .8s ease;
  }
  .link-btn:hover::after{ transform: translateX(120%); }

  .icon{
    width:38px; height:38px;
    min-width:38px;
    border-radius:50%;
    background: rgba(230,189,117,.12);
    border:1px solid rgba(230,189,117,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:18px; height:18px; fill:var(--gold-bright); }

  .label{
    flex:1;
    text-align: start;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .label .t{
    font-weight:700;
    font-size:15.5px;
    letter-spacing:.01em;
  }
  .label .s{
    font-size:11.5px;
    color:var(--cream-dim);
    font-family:'Jost',sans-serif;
    letter-spacing:.06em;
    opacity:.75;
  }
  .arrow{
    font-size:16px;
    color:var(--gold-bright);
    opacity:.7;
    transition:transform .35s ease;
  }
  html[dir="rtl"] .arrow{ transform:scaleX(-1); }
  .link-btn:hover .arrow{ transform: translateX(4px); }
  html[dir="rtl"] .link-btn:hover .arrow{ transform: scaleX(-1) translateX(4px); }

  footer{
    margin-top:52px;
    font-family:'Jost',sans-serif;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(217,198,169,.55);
    animation: rise .9s .55s cubic-bezier(.2,.9,.25,1) both;
  }

  @media (max-width:380px){
    .wrap{padding-top:90px;}
    .badge{width:92px;height:92px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

<script>
  // Decorative bean dots
  (function () {
    var dots = document.getElementById('dots');
    var n = 10, r = 56;

    if (dots) {
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2;
        var x = 56 + r * Math.cos(a);
        var y = 56 + r * Math.sin(a);

        var d = document.createElement('span');
        d.style.left = x + 'px';
        d.style.top = y + 'px';

        dots.appendChild(d);
      }
    }
  })();


  function setLang(lang) {

    var html = document.documentElement;
    var isAr = lang === 'ar';

    // Direction
    html.setAttribute('lang', isAr ? 'ar' : 'en');
    html.setAttribute('dir', isAr ? 'rtl' : 'ltr');

    // Font
    document.body.style.fontFamily = isAr
      ? "'Tajawal', 'Jost', sans-serif"
      : "'Jost', 'Tajawal', sans-serif";

    // Language buttons
    var btnAr = document.getElementById('btn-ar');
    var btnEn = document.getElementById('btn-en');

    if (btnAr) {
      btnAr.classList.toggle('active', isAr);
    }

    if (btnEn) {
      btnEn.classList.toggle('active', !isAr);
    }

    // Change all translations
    document.querySelectorAll('[data-ar][data-en]').forEach(function (el) {

      if (isAr) {
        el.textContent = el.getAttribute('data-ar');
      } else {
        el.textContent = el.getAttribute('data-en');
      }

    });

    // Save language
    try {
      localStorage.setItem('abdeen-lang', lang);
    } catch (e) {}

  }


  // DEFAULT LANGUAGE = ENGLISH
  (function () {

    var savedLanguage = null;

    try {
      savedLanguage = localStorage.getItem('abdeen-lang');
    } catch (e) {}

    // If user already selected a language, use it.
    // Otherwise English.
    var language = savedLanguage || 'en';

    setLang(language);

  })();
</script>
